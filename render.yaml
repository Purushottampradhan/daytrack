# Blueprint: deploy DayTrack API only. Frontend is served from site-hub (/daytrack/).
# Use the SAME MONGODB_URI as quiz97 (same Atlas cluster). Default DB name: daytrack.

services:
  - type: web
    name: daytrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: daytrack
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_RENDER
        value: "false"
